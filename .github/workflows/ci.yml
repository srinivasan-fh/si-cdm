name: CI

on:
  push:
  pull_request:

jobs:
  macos-xcode:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Xcode generator)
        run: cmake --preset xcode
      - name: Build
        run: cmake --build --preset xcode-release -- -quiet
      - name: Test
        run: ctest --preset xcode

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev xvfb
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release -j
      - name: Test
        run: ctest --preset release
      - name: Render landing page
        run: xvfb-run -a -s "-screen 0 1600x960x24" ./build/release/sicdm --size 1600 960 --screenshot landing.ppm
